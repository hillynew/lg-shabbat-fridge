name: Shabbat mode tick

on:
  # Coverage comes from chaining: each run polls for about 5.5 hours
  # (TICK_RUN_MINUTES), then starts the next run itself with
  # `gh workflow run`. A workflow_dispatch made with GITHUB_TOKEN is the
  # documented exception that does start a new run, and it never leaves
  # GitHub's own infrastructure.
  #
  # This hourly schedule is only a watchdog that restarts the chain if it
  # ever breaks. On its own it was not enough: on this repo it fired just
  # 3-4 times a day (gaps of 6-8 hours), so each 55-minute run covered a
  # small fraction of the day and the Erev Shabbos ON was routinely missed.
  # The concurrency group below means a watchdog run that fires while the
  # chain is alive just waits as the single pending run and continues it.
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force a flip regardless of the calendar (on/off), or leave blank for a normal tick'
        required: false
        type: choice
        options:
          - ''
          - 'on'
          - 'off'
        default: ''

# One poller at a time. GitHub keeps at most one pending run per group, so
# extra watchdog or chained runs collapse into that single pending run.
# Forced on/off runs use their own group so they act immediately instead of
# queueing behind a 5.5-hour poller.
concurrency:
  group: ${{ github.event.inputs.force && 'shabbat-force' || 'shabbat-tick' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # lets the run start its successor

jobs:
  tick:
    runs-on: ubuntu-latest
    # GitHub-hosted jobs are capped at 360 minutes; TICK_RUN_MINUTES stays
    # well under this.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run tick
        id: tick
        env:
          # Official ThinQ Connect API (preferred channel, if writable on your model)
          THINQ_PAT: ${{ secrets.THINQ_PAT }}
          THINQ_CLIENT_ID: ${{ secrets.THINQ_CLIENT_ID }}
          THINQ_DEVICE_ID: ${{ secrets.THINQ_DEVICE_ID }}
          THINQ_SABBATH_ON_VALUE: ${{ secrets.THINQ_SABBATH_ON_VALUE }}
          THINQ_SABBATH_OFF_VALUE: ${{ secrets.THINQ_SABBATH_OFF_VALUE }}
          # App channel fallback (used automatically when the above isn't writable)
          THINQ_V2_REFRESH_TOKEN: ${{ secrets.THINQ_V2_REFRESH_TOKEN }}
          THINQ_V2_OAUTH_URL: ${{ secrets.THINQ_V2_OAUTH_URL }}
          THINQ_V2_USER_NUMBER: ${{ secrets.THINQ_V2_USER_NUMBER }}
          THINQ_V2_CLIENT_ID: ${{ secrets.THINQ_V2_CLIENT_ID }}
          THINQ_V2_DEVICE_ID: ${{ secrets.THINQ_V2_DEVICE_ID }}
          THINQ_V2_SABBATH_CTRL: ${{ secrets.THINQ_V2_SABBATH_CTRL }}
          # Location (required — pick ONE of these two ways)
          SHABBAT_ZIP: ${{ secrets.SHABBAT_ZIP }}                 # a US zip code, e.g. 33016
          SHABBAT_LATITUDE: ${{ secrets.SHABBAT_LATITUDE }}       # alternative to zip
          SHABBAT_LONGITUDE: ${{ secrets.SHABBAT_LONGITUDE }}
          SHABBAT_TZID: ${{ secrets.SHABBAT_TZID }}               # default: America/New_York
          # Schedule config (all optional — defaults shown)
          SHABBAT_ENABLED: ${{ secrets.SHABBAT_ENABLED }}                   # default: true
          SHABBAT_ON_TIME: ${{ secrets.SHABBAT_ON_TIME }}                   # default: 12:00 local, every Erev Shabbos/Yom Tov
          SHABBAT_HAVDALAH_MINUTES: ${{ secrets.SHABBAT_HAVDALAH_MINUTES }} # default: 60 (minutes after sunset)
          FORCE: ${{ github.event.inputs.force }}
          TICK_RUN_MINUTES: '330'
        run: node scripts/tick.js
      # Start the next run so checks continue without waiting for GitHub's
      # schedule. Only when tick.js reports a full polling run: a forced run,
      # the SHABBAT_ENABLED=false kill switch, a missing channel or a
      # configuration error all end early, and chaining them would start
      # runs back to back without end (the hourly watchdog retries instead).
      - name: Chain the next run
        if: steps.tick.outputs.chain == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run shabbat-tick.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
