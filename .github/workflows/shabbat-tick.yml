name: Shabbat mode tick

on:
  # GitHub's own `schedule:` trigger is NOT used here — it's documented to
  # be delayed/dropped under load, and in practice on a low-traffic repo a
  # */15 schedule fires only a small, irregular fraction of its configured
  # times (confirmed live: real gaps of 2-6+ hours between runs, landing
  # outside the declared windows entirely). That's unacceptable for a
  # precise-time religious-observance trigger.
  #
  # Instead, an external free cron pinger (e.g. cron-job.org) calls this
  # workflow's `workflow_dispatch` REST API on a real schedule — GitHub
  # still runs the actual code, the external service just triggers it
  # reliably. See README.md "Reliable triggering" for setup.
  #
  # Target windows to replicate in the external pinger (every 15 min):
  #   Midday: 15:00-18:59 UTC  (covers noon ET under both EDT/EST, padded)
  #   Evening: 21:00-02:59 UTC (covers sunset+60 ET under both DST states
  #            across the year at ~26°N; crosses UTC midnight)
  workflow_dispatch:
    inputs:
      force:
        description: 'Force a flip regardless of the calendar (on/off), or leave blank for a normal tick'
        required: false
        type: choice
        options:
          - ''
          - 'on'
          - 'off'
        default: ''

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run tick
        env:
          # Official ThinQ Connect API (preferred channel, if writable on your model)
          THINQ_PAT: ${{ secrets.THINQ_PAT }}
          THINQ_CLIENT_ID: ${{ secrets.THINQ_CLIENT_ID }}
          THINQ_DEVICE_ID: ${{ secrets.THINQ_DEVICE_ID }}
          THINQ_SABBATH_ON_VALUE: ${{ secrets.THINQ_SABBATH_ON_VALUE }}
          THINQ_SABBATH_OFF_VALUE: ${{ secrets.THINQ_SABBATH_OFF_VALUE }}
          # App channel fallback (used automatically when the above isn't writable)
          THINQ_V2_REFRESH_TOKEN: ${{ secrets.THINQ_V2_REFRESH_TOKEN }}
          THINQ_V2_OAUTH_URL: ${{ secrets.THINQ_V2_OAUTH_URL }}
          THINQ_V2_USER_NUMBER: ${{ secrets.THINQ_V2_USER_NUMBER }}
          THINQ_V2_CLIENT_ID: ${{ secrets.THINQ_V2_CLIENT_ID }}
          THINQ_V2_DEVICE_ID: ${{ secrets.THINQ_V2_DEVICE_ID }}
          THINQ_V2_SABBATH_CTRL: ${{ secrets.THINQ_V2_SABBATH_CTRL }}
          # Location (required — pick ONE of these two ways)
          SHABBAT_ZIP: ${{ secrets.SHABBAT_ZIP }}                 # a US zip code, e.g. 33016
          SHABBAT_LATITUDE: ${{ secrets.SHABBAT_LATITUDE }}       # alternative to zip
          SHABBAT_LONGITUDE: ${{ secrets.SHABBAT_LONGITUDE }}
          SHABBAT_TZID: ${{ secrets.SHABBAT_TZID }}               # default: America/New_York
          # Schedule config (all optional — defaults shown)
          SHABBAT_ENABLED: ${{ secrets.SHABBAT_ENABLED }}                   # default: true
          SHABBAT_ON_TIME: ${{ secrets.SHABBAT_ON_TIME }}                   # default: 12:00 local, every Erev Shabbos/Yom Tov
          SHABBAT_HAVDALAH_MINUTES: ${{ secrets.SHABBAT_HAVDALAH_MINUTES }} # default: 60 (minutes after sunset)
          FORCE: ${{ github.event.inputs.force }}
        run: node scripts/tick.js
