name: Shabbat mode tick

on:
  # Runs once an hour, offset to :07 rather than :00 — GitHub's own docs
  # warn that the top of every hour is when its scheduler is most congested
  # (everyone else's cron fires there too), which is the actual cause of
  # the unreliability seen with a high-frequency `*/15` schedule tried
  # earlier (confirmed live: gaps of 2-6+ hours between runs). Hourly, off
  # the round hour, is a well-established reliable pattern.
  #
  # Precision comes from scripts/tick.js itself: each hourly run polls
  # internally every few minutes for the rest of the hour, so the actual
  # ON/OFF moment still gets caught within a few minutes. Two earlier
  # external-trigger approaches (cron-job.org, then a Cloudflare Worker
  # relay calling GitHub's workflow_dispatch API every few minutes) were
  # abandoned after both consistently got 404s from GitHub that were never
  # explained — the identical request succeeded via plain curl every time,
  # pointing at GitHub deprioritizing traffic that self-identifies as
  # coming from an edge/serverless network. This design needs no external
  # caller at all: nothing outside GitHub Actions' own infrastructure ever
  # talks to GitHub's API.
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force a flip regardless of the calendar (on/off), or leave blank for a normal tick'
        required: false
        type: choice
        options:
          - ''
          - 'on'
          - 'off'
        default: ''

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run tick
        env:
          # Official ThinQ Connect API (preferred channel, if writable on your model)
          THINQ_PAT: ${{ secrets.THINQ_PAT }}
          THINQ_CLIENT_ID: ${{ secrets.THINQ_CLIENT_ID }}
          THINQ_DEVICE_ID: ${{ secrets.THINQ_DEVICE_ID }}
          THINQ_SABBATH_ON_VALUE: ${{ secrets.THINQ_SABBATH_ON_VALUE }}
          THINQ_SABBATH_OFF_VALUE: ${{ secrets.THINQ_SABBATH_OFF_VALUE }}
          # App channel fallback (used automatically when the above isn't writable)
          THINQ_V2_REFRESH_TOKEN: ${{ secrets.THINQ_V2_REFRESH_TOKEN }}
          THINQ_V2_OAUTH_URL: ${{ secrets.THINQ_V2_OAUTH_URL }}
          THINQ_V2_USER_NUMBER: ${{ secrets.THINQ_V2_USER_NUMBER }}
          THINQ_V2_CLIENT_ID: ${{ secrets.THINQ_V2_CLIENT_ID }}
          THINQ_V2_DEVICE_ID: ${{ secrets.THINQ_V2_DEVICE_ID }}
          THINQ_V2_SABBATH_CTRL: ${{ secrets.THINQ_V2_SABBATH_CTRL }}
          # Location (required — pick ONE of these two ways)
          SHABBAT_ZIP: ${{ secrets.SHABBAT_ZIP }}                 # a US zip code, e.g. 33016
          SHABBAT_LATITUDE: ${{ secrets.SHABBAT_LATITUDE }}       # alternative to zip
          SHABBAT_LONGITUDE: ${{ secrets.SHABBAT_LONGITUDE }}
          SHABBAT_TZID: ${{ secrets.SHABBAT_TZID }}               # default: America/New_York
          # Schedule config (all optional — defaults shown)
          SHABBAT_ENABLED: ${{ secrets.SHABBAT_ENABLED }}                   # default: true
          SHABBAT_ON_TIME: ${{ secrets.SHABBAT_ON_TIME }}                   # default: 12:00 local, every Erev Shabbos/Yom Tov
          SHABBAT_HAVDALAH_MINUTES: ${{ secrets.SHABBAT_HAVDALAH_MINUTES }} # default: 60 (minutes after sunset)
          FORCE: ${{ github.event.inputs.force }}
        run: node scripts/tick.js
