name: Worker safety tests
on:
  pull_request:
  push:
    branches: ['feat/free-worker-shadow']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run worker:dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
