name: Official LG read-only check

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: official-lg-read-only-check
  cancel-in-progress: false

jobs:
  probe:
    if: github.actor == 'hillynew' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Download and verify reviewed diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts test
          curl --fail --silent --show-error --proto '=https' --max-time 30 'https://raw.githubusercontent.com/hillynew/lg-shabbat-fridge/0b9248e77f2d18ea9467d4793492cc94a891c1c1/scripts/probe-official.mjs' -o scripts/probe-official.mjs
          curl --fail --silent --show-error --proto '=https' --max-time 30 'https://raw.githubusercontent.com/hillynew/lg-shabbat-fridge/0b9248e77f2d18ea9467d4793492cc94a891c1c1/test/official-probe.test.mjs' -o test/official-probe.test.mjs
          echo '858d81933aac58581a4d5bc47be9ba51365b651d0e3b46dbdc034dd022a4749e  scripts/probe-official.mjs' | sha256sum --check -
          echo '36d5fe8c6685bcfdbe007b460ec9cdccdbfa23a513e1c2b96bbf27bcd6f7c902  test/official-probe.test.mjs' | sha256sum --check -
      - name: Test diagnostic without credentials
        run: node --test test/official-probe.test.mjs
      - name: Read official device capabilities and state
        env:
          THINQ_PAT: ${{ secrets.THINQ_PAT }}
          THINQ_CLIENT_ID: ${{ secrets.THINQ_CLIENT_ID }}
          THINQ_DEVICE_ID: ${{ secrets.THINQ_DEVICE_ID }}
          THINQ_V2_DEVICE_ID: ${{ secrets.THINQ_V2_DEVICE_ID }}
        run: node scripts/probe-official.mjs
