name: Official LG read-only check

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: official-lg-read-only-check
  cancel-in-progress: false

jobs:
  probe:
    if: github.actor == 'hillynew' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Download and verify reviewed diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts test
          curl --fail --silent --show-error --proto '=https' --max-time 30 'https://raw.githubusercontent.com/hillynew/lg-shabbat-fridge/c44fb7ac73699726508c4fb7a1668bfdc827e36e/scripts/probe-official.mjs' -o scripts/probe-official.mjs
          curl --fail --silent --show-error --proto '=https' --max-time 30 'https://raw.githubusercontent.com/hillynew/lg-shabbat-fridge/c44fb7ac73699726508c4fb7a1668bfdc827e36e/test/official-probe.test.mjs' -o test/official-probe.test.mjs
          echo 'c3f979a13601cc934496e40bd0b616d1031690ea540e9558877096c04b18d5bb  scripts/probe-official.mjs' | sha256sum --check -
          echo '38c6c260690c7b68407a00981b8eb4bb5c2d2537a54bd4d2b506d314818e57d8  test/official-probe.test.mjs' | sha256sum --check -
      - name: Test diagnostic without credentials
        run: node --test test/official-probe.test.mjs
      - name: Read official device capabilities and state
        env:
          THINQ_PROBE_DISCOVER: 'true'
          THINQ_PAT: ${{ secrets.THINQ_PAT }}
          THINQ_CLIENT_ID: ${{ secrets.THINQ_CLIENT_ID }}
          THINQ_DEVICE_ID: ${{ secrets.THINQ_DEVICE_ID }}
          THINQ_V2_DEVICE_ID: ${{ secrets.THINQ_V2_DEVICE_ID }}
        run: node scripts/probe-official.mjs
