name: Official LG read-only check

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: official-lg-read-only-check
  cancel-in-progress: false

jobs:
  probe:
    if: github.actor == 'hillynew' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Download and verify reviewed diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts test
          curl --fail --silent --show-error --proto '=https' --max-time 30 'https://raw.githubusercontent.com/hillynew/lg-shabbat-fridge/97965ded61f1de5ab45540ad81b754c48a5ae3fb/scripts/probe-official.mjs' -o scripts/probe-official.mjs
          curl --fail --silent --show-error --proto '=https' --max-time 30 'https://raw.githubusercontent.com/hillynew/lg-shabbat-fridge/97965ded61f1de5ab45540ad81b754c48a5ae3fb/test/official-probe.test.mjs' -o test/official-probe.test.mjs
          echo '4262746c1cf18521aec17820c788bad6015b8dd054e0e9a93e243a4b6548d582  scripts/probe-official.mjs' | sha256sum --check -
          echo '543cd23c10e712b6a8334cd0d6247be963b075dbef560ad8890b9a44513b14f8  test/official-probe.test.mjs' | sha256sum --check -
      - name: Test diagnostic without credentials
        run: node --test test/official-probe.test.mjs
      - name: Read official device capabilities and state
        env:
          THINQ_PROBE_DISCOVER: 'true'
          THINQ_PAT: ${{ secrets.THINQ_PAT }}
          THINQ_CLIENT_ID: ${{ secrets.THINQ_CLIENT_ID }}
          THINQ_DEVICE_ID: ${{ secrets.THINQ_DEVICE_ID }}
          THINQ_V2_DEVICE_ID: ${{ secrets.THINQ_V2_DEVICE_ID }}
        run: node scripts/probe-official.mjs
